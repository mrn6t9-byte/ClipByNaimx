<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipByNaim Direct Recorder</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.min.js"></script>

<style>
*{box-sizing:border-box}
body{background:#0f2027;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:10px;margin:0}
input,button{width:100%;padding:14px;margin:5px 0;border-radius:10px;border:none;font-size:16px}
button{background:#2c5364;color:#fff}
button:disabled{opacity:.4}
#rec{background:#c0392b}
video{width:100%;background:#000;border-radius:12px;margin-top:10px}
#msg{min-height:24px;word-break:break-word}
</style>
</head>

<body>

<h2>ClipByNaim Direct Recorder</h2>

<input id="link" placeholder="Paste .m3u8 link">

<button id="play">Play</button>
<button id="rec">Start Recording</button>
<button id="stop" disabled>Stop & Save</button>

<video id="v" controls autoplay muted playsinline></video>

<p id="msg"></p>

<script>
// ===== Settings =====
const MAX_HEIGHT = 0;          // 0 = sobcheye bhalo quality. 720 dile 720p porjonto
const START_BACK_SEGS = 3;     // live e koyta segment pichhon theke shuru hobe
const ALSO_SAVE_TS = false;    // true dile MP4 er sathe original .ts o save hobe (RAM beshi lagbe)
// ====================

const v = document.getElementById("v");
const msg = document.getElementById("msg");
const linkEl = document.getElementById("link");
const recBtn = document.getElementById("rec");
const stopBtn = document.getElementById("stop");

const sleep = ms => new Promise(r => setTimeout(r, ms));
const abs = (u, base) => new URL(u, base).href;

let hls, vDl, aDl, allDone, timer, startTime, wakeLock;
let finishing = false, cancelled = false, prep = null, qualityInfo = "";

// ---------- HELPERS ----------
async function getText(u) {
  const r = await fetch(u, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.text();
}

async function getBuf(u) {
  for (let t = 0; t < 3; t++) {
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.arrayBuffer();
    } catch (e) { await sleep(500); }
  }
  return null;
}

function parseMaster(text, base) {
  const lines = text.split(/\r?\n/);
  const variants = [], audios = {};
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (l.startsWith("#EXT-X-STREAM-INF:")) {
      const bw = +((/BANDWIDTH=(\d+)/.exec(l) || [0, 0])[1]);
      const res = (/RESOLUTION=(\d+x(\d+))/.exec(l) || []);
      const aud = (/AUDIO="([^"]+)"/.exec(l) || [])[1];
      let j = i + 1;
      while (j < lines.length && (!lines[j].trim() || lines[j].startsWith("#"))) j++;
      if (j < lines.length) {
        variants.push({ bw, res: res[1] || "", h: +(res[2] || 0), aud, url: abs(lines[j].trim(), base) });
      }
    } else if (l.startsWith("#EXT-X-MEDIA:") && /TYPE=AUDIO/.test(l)) {
      const g = (/GROUP-ID="([^"]+)"/.exec(l) || [])[1];
      const uri = (/URI="([^"]+)"/.exec(l) || [])[1];
      if (g && uri) {
        if (!audios[g]) audios[g] = [];
        audios[g].push({ url: abs(uri, base), def: /DEFAULT=YES/.test(l) });
      }
    }
  }
  return { variants, audios };
}

function parseMedia(text, base) {
  const lines = text.split(/\r?\n/);
  let seq = 0, dur = 6, ended = false, map = null, curKey = null;
  const segs = [];
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (l.startsWith("#EXT-X-MEDIA-SEQUENCE:")) seq = parseInt(l.split(":")[1]) || 0;
    else if (l.startsWith("#EXT-X-TARGETDURATION:")) dur = parseInt(l.split(":")[1]) || 6;
    else if (l.startsWith("#EXT-X-ENDLIST")) ended = true;
    else if (l.startsWith("#EXT-X-MAP:")) {
      const u = (/URI="([^"]+)"/.exec(l) || [])[1];
      if (u) map = abs(u, base);
    } else if (l.startsWith("#EXT-X-KEY:")) {
      const m = (/METHOD=([^,]+)/.exec(l) || [])[1];
      if (m === "AES-128") {
        const u = (/URI="([^"]+)"/.exec(l) || [])[1];
        const iv = (/IV=(0x[0-9a-fA-F]+)/.exec(l) || [])[1];
        curKey = { uri: abs(u, base), iv };
      } else if (m === "NONE") curKey = null;
      else curKey = { unsupported: m };
    } else if (l[0] !== "#") {
      segs.push({ url: abs(l, base), n: seq + segs.length, key: curKey });
    }
  }
  return { segs, dur, ended, map };
}

const keyCache = {};
async function decrypt(buf, key, n) {
  if (!keyCache[key.uri]) keyCache[key.uri] = await (await fetch(key.uri)).arrayBuffer();
  const iv = new Uint8Array(16);
  if (key.iv) {
    const h = key.iv.replace(/^0x/i, "").padStart(32, "0");
    for (let i = 0; i < 16; i++) iv[i] = parseInt(h.substr(i * 2, 2), 16);
  } else {
    new DataView(iv.buffer).setUint32(12, n);
  }
  const ck = await crypto.subtle.importKey("raw", keyCache[key.uri], "AES-CBC", false, ["decrypt"]);
  return crypto.subtle.decrypt({ name: "AES-CBC", iv }, ck, buf);
}

function sniffExt(first) {
  if (first && first[0] === 0x47) return "ts";
  if (first && (first[0] === 0xFF || (first[0] === 0x49 && first[1] === 0x44))) return "aac";
  return "ts";
}

function save(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 120000);
}

// ---------- PREPARE (Play chaplei pichone ready hoye thake) ----------
async function prepare(url) {
  const text = await getText(url);
  let vUrl = url, aUrl = null, info = "single stream";

  if (text.includes("#EXT-X-STREAM-INF")) {
    const m = parseMaster(text, url);
    let list = m.variants.slice().sort((a, b) => b.bw - a.bw);
    if (MAX_HEIGHT) {
      const f = list.filter(x => x.h && x.h <= MAX_HEIGHT);
      if (f.length) list = f;
    }
    const best = list[0];
    vUrl = best.url;
    info = (best.res || "?") + " " + (best.bw / 1e6).toFixed(1) + "Mbps";
    if (best.aud && m.audios[best.aud]) {
      const g = m.audios[best.aud];
      aUrl = (g.find(x => x.def) || g[0]).url;
    }
  }
  prep = { url, vUrl, aUrl, info };
  return prep;
}

// ---------- DOWNLOADER (segment save + MP4 convert) ----------
class Dl {
  constructor(url) {
    this.url = url;
    this.raw = [];          // original parts
    this.mp4 = [];          // converted mp4 parts
    this.bytes = 0;
    this.count = 0;
    this.stop = false;
    this.fmp4 = false;
    this.mapDone = false;
    this.first = true;
    this.convOk = false;
    this.gotInit = false;
    this.firstBytes = null;
    this.err = "";
    this.seen = new Set();
    this.tx = null;

    if (window.muxjs) {
      this.tx = new muxjs.mp4.Transmuxer();
      this.tx.on("data", s => {
        let b;
        if (!this.gotInit) {
          this.gotInit = true;
          b = new Uint8Array(s.initSegment.byteLength + s.data.byteLength);
          b.set(s.initSegment, 0);
          b.set(s.data, s.initSegment.byteLength);
        } else b = s.data;
        this.mp4.push(b);
        this.convOk = true;
      });
    }
  }

  async run() {
    try { await this._run(); } catch (e) { this.err = e.message; }
  }

  async _run() {
    while (!this.stop) {
      let pl;
      try {
        pl = parseMedia(await getText(this.url), this.url);
      } catch (e) {
        this.err = e.message;
        await sleep(1500);
        continue;
      }
      this.err = "";

      if (pl.map && !this.mapDone) {
        const b = await getBuf(pl.map);
        if (b) { this.fmp4 = true; this.mapDone = true; this.raw.push(new Uint8Array(b)); }
      }

      if (this.first) {
        this.first = false;
        if (!pl.ended && pl.segs.length > START_BACK_SEGS) {
          pl.segs.slice(0, pl.segs.length - START_BACK_SEGS).forEach(s => this.seen.add(s.n));
        }
      }

      const todo = pl.segs.filter(s => !this.seen.has(s.n));
      todo.forEach(s => this.seen.add(s.n));

      // 3 ta kore ek sathe download (shuru te delay kom hoy)
      for (let i = 0; i < todo.length && !this.stop; i += 3) {
        const chunk = todo.slice(i, i + 3);
        const res = await Promise.all(chunk.map(s => this.fetchSeg(s)));
        for (const u8 of res) {
          if (u8) { this.count++; this.addSeg(u8); }
        }
      }

      if (pl.ended) break;
      await sleep(Math.max(700, pl.dur * 300));
    }
  }

  async fetchSeg(s) {
    if (s.key && s.key.unsupported) { this.err = "Encrypted: " + s.key.unsupported; this.stop = true; return null; }
    let b = await getBuf(s.url);
    if (!b) return null;
    if (s.key) {
      try { b = await decrypt(b, s.key, s.n); }
      catch (e) { this.err = "Decrypt error"; return null; }
    }
    return new Uint8Array(b);
  }

  addSeg(u8) {
    this.bytes += u8.byteLength;
    if (!this.firstBytes) this.firstBytes = u8;

    if (this.tx && !this.fmp4) {
      try { this.tx.push(u8); this.tx.flush(); } catch (e) {}
    }
    // convert thik thakle original ar RAM e rakhi na
    if (this.fmp4 || !this.tx || !this.convOk || ALSO_SAVE_TS) this.raw.push(u8);
  }

  output() {
    if (this.fmp4) return { blob: new Blob(this.raw, { type: "video/mp4" }), ext: "mp4" };
    if (this.tx && this.convOk) return { blob: new Blob(this.mp4, { type: "video/mp4" }), ext: "mp4", conv: true };
    const ext = sniffExt(this.firstBytes);
    return { blob: new Blob(this.raw, { type: ext === "ts" ? "video/mp2t" : "audio/aac" }), ext };
  }
}

// ---------- PLAYER ----------
document.getElementById("play").onclick = () => {
  const url = linkEl.value.trim();
  if (!url) { alert("Paste link"); return; }

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 180 });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) msg.innerText = "Error: " + d.type + " / " + d.details;
    });
  } else {
    v.src = url;
  }
  msg.innerText = "Playing...";

  // pichone recording er jonno ready kore rakhi
  prepare(url).then(p => {
    if (!vDl) msg.innerText = "Playing... | Rec ready: " + p.info + (p.aUrl ? " (audio alada)" : "");
  }).catch(() => {});
};

// ---------- RECORD ----------
function tick() {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const t = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  if (!vDl) { msg.innerText = "Recording " + t + " | shuru hocche..."; return; }
  if (vDl.stop) return;
  const mb = ((vDl.bytes + (aDl ? aDl.bytes : 0)) / 1048576).toFixed(1);
  msg.innerText = "Recording " + t + " | " + qualityInfo +
    " | " + vDl.count + " seg | " + mb + " MB" +
    (aDl ? " | audio alada" : "") +
    (vDl.err ? " | " + vDl.err : "");
}

recBtn.onclick = async () => {
  const url = linkEl.value.trim();
  if (!url) { alert("Paste link"); return; }

  recBtn.disabled = true;
  stopBtn.disabled = false;
  finishing = false;
  cancelled = false;
  vDl = null;
  aDl = null;

  startTime = Date.now();
  clearInterval(timer);
  timer = setInterval(tick, 500);
  tick();                                   // sathe sathe timer dekhay

  try {
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => wakeLock = l).catch(() => {});
  } catch (e) {}

  let p = (prep && prep.url === url) ? prep : null;
  if (!p) {
    try { p = await prepare(url); }
    catch (e) {
      clearInterval(timer);
      msg.innerText = "Error: " + e.message + " (link/CORS check korun)";
      recBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }
  }

  if (cancelled) {
    clearInterval(timer);
    msg.innerText = "Cancelled";
    recBtn.disabled = false;
    return;
  }

  qualityInfo = p.info;
  vDl = new Dl(p.vUrl);
  const jobs = [vDl.run()];
  if (p.aUrl) { aDl = new Dl(p.aUrl); jobs.push(aDl.run()); }
  allDone = Promise.all(jobs);
  allDone.then(() => finish());
};

// ---------- STOP / FINISH ----------
stopBtn.onclick = () => {
  stopBtn.disabled = true;
  if (!vDl) { cancelled = true; return; }
  msg.innerText = "Save korchi...";
  vDl.stop = true;
  if (aDl) aDl.stop = true;
};

async function finish() {
  if (finishing) return;
  finishing = true;
  clearInterval(timer);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  stopBtn.disabled = true;

  const ts = Date.now();

  if (!vDl.count) {
    msg.innerText = "Kono data pai nai. " + (vDl.err || "");
    recBtn.disabled = false;
    return;
  }

  const vo = vDl.output();
  save(vo.blob, "ClipByNaim_" + ts + "." + vo.ext);
  let note = vo.ext === "mp4"
    ? "MP4 saved"
    : ".ts saved (MP4 convert hoy nai, VLC/MX Player e chalan)";

  if (ALSO_SAVE_TS && vo.conv) {
    await sleep(800);
    save(new Blob(vDl.raw, { type: "video/mp2t" }), "ClipByNaim_" + ts + ".ts");
    note += " + .ts";
  }

  if (aDl && aDl.count) {
    await sleep(800);
    const ao = aDl.output();
    save(ao.blob, "ClipByNaim_" + ts + "_audio." + ao.ext);
    note += " | Audio alada: _audio." + ao.ext;
  }

  msg.innerText = note;
  recBtn.disabled = false;
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && vDl && !finishing && navigator.wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
</script>

</body>
</html>
